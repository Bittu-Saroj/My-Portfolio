<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio manager</title>
<style>
:root{font:16px/1.5 system-ui;color:#172033;background:#f5f3ee}body{margin:0}header{background:#172033;color:white;padding:1rem 5%;display:flex;justify-content:space-between;align-items:center;gap:1rem}header a{color:#f4c542}main{max-width:1000px;margin:2rem auto;padding:0 1rem}section{background:white;border-radius:14px;padding:1.5rem;margin:1rem 0;box-shadow:0 5px 25px #17203312}label{display:block;font-weight:600;margin:.8rem 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;padding:.65rem;border:1px solid #ccd2d8;border-radius:6px;font:inherit}textarea{min-height:80px}button{border:0;border-radius:7px;background:#f4c542;color:#172033;font-weight:700;padding:.65rem 1rem;cursor:pointer}button.secondary{background:#e9edf0}nav{display:flex;gap:.5rem;flex-wrap:wrap}nav button{background:#e9edf0}nav button.active{background:#f4c542}.record{display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.8rem 0;border-bottom:1px solid #e7e9ec}.record span{flex:1;overflow-wrap:anywhere}.actions{display:flex;gap:.4rem}.error{color:#a52536}.success{color:#167548}[hidden]{display:none!important}@media(max-width:600px){header{flex-wrap:wrap}main{margin:1rem auto}.record{align-items:flex-start;flex-wrap:wrap}}
</style></head><body><header><strong>Portfolio manager <small>· experimental</small></strong><a href="/">View portfolio</a><button id="logout" class="secondary" hidden>Sign out</button></header><main><p id="message" role="status"></p><section id="login"><h1>Sign in</h1><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="workspace" hidden><nav id="navigation"></nav><section><h1 id="heading"></h1><p id="help"></p><div id="records"></div><button id="add" type="button">Add new</button></section><section id="editor" hidden><h2 id="editor-heading"></h2><form id="editor-form"></form></section></div></main>
<script>
(()=>{
  let token='',kind='photos',records=[];
  const configs={photos:{label:'Photos & cover',fields:['title','alt_text','category','caption','sort_order'],files:{filename:'Photo image'}},projects:{label:'Design projects',fields:['title','category','tools','description'],files:{filename:'Project image'}},videos:{label:'Videos',fields:['title','description','external_url','sort_order'],files:{filename:'Video (MP4/WebM)',thumb:'Thumbnail'}},tools:{label:'Tools',fields:['title','description','sort_order'],files:{image:'Tool image'}},process:{label:'Process',fields:['step_index','title','description'],files:{}},settings:{label:'Site settings'}};
  const keys=['site_name','hero_eyebrow','hero_title','hero_sub','hero_intro','about_text','education_title','education_text','design_intro','photo_intro','before_title','before_intro','before_image','after_image','video_intro','projects_intro','contact_title','contact_intro','email','phone','instagram_url','instagram_label','facebook_url','facebook_label','github_url','linkedin_url'];
  const $=id=>document.getElementById(id), label=s=>s.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase());
  const say=(s,error=false)=>{ $('message').textContent=s; $('message').className=error?'error':'success'; };
  async function api(path,options={}){const headers=new Headers(options.headers||{});if(options.method&&options.method!=='GET')headers.set('X-CSRF-Token',token);const r=await fetch('/api/admin'+path,{...options,headers,credentials:'same-origin'});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.detail||'Request failed');return data}
  async function refreshSession(){const s=await api('/session');token=s.csrf;$('login').hidden=s.authenticated;$('workspace').hidden=!s.authenticated;$('logout').hidden=!s.authenticated;if(s.authenticated)await load()}
  $('login-form').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.currentTarget);const s=await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});token=s.csrf;e.currentTarget.reset();say('Signed in.');await refreshSession()}catch(err){say(err.message,true)}};
  $('logout').onclick=async()=>{try{await api('/logout',{method:'POST'});token='';await refreshSession();say('Signed out.')}catch(err){say(err.message,true)}};
  async function load(){try{$('editor').hidden=true;$('heading').textContent=configs[kind].label;$('help').textContent=kind==='photos'?'Set category to “cover” to use a photo on the homepage.':'';$('add').hidden=kind==='settings';$('records').replaceChildren();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind));if(kind==='settings'){edit(await api('/settings'));return}records=await api('/content/'+kind);if(!records.length){$('records').textContent='No items yet.';return}records.forEach(row=>{const div=document.createElement('div');div.className='record';const title=document.createElement('span');title.textContent=row.title||`Item ${row.id}`;const actions=document.createElement('div');actions.className='actions';const change=document.createElement('button');change.textContent='Edit';change.onclick=()=>edit(row);const remove=document.createElement('button');remove.className='secondary';remove.textContent='Delete';remove.onclick=async()=>{if(!confirm('Delete this record? Uploaded files will be kept.'))return;try{await api(`/content/${kind}/${row.id}/delete`,{method:'POST'});say('Record deleted.');await load()}catch(err){say(err.message,true)}};actions.append(change,remove);div.append(title,actions);$('records').append(div)})}catch(err){say(err.message,true)}}
  function edit(row={}){const f=$('editor-form');f.replaceChildren();$('editor').hidden=false;$('editor-heading').textContent=kind==='settings'?'Edit site settings':row.id?'Edit item':'Add item';const fields=kind==='settings'?keys:configs[kind].fields;for(const field of fields){const wrap=document.createElement('label');wrap.textContent=label(field);const input=document.createElement(field.includes('description')||field.includes('intro')||field.includes('text')?'textarea':'input');input.name=field;input.value=row[field]??'';if(['sort_order','step_index'].includes(field))input.type='number';wrap.append(input);f.append(wrap)}if(kind!=='settings')for(const [field,title] of Object.entries(configs[kind].files)){const wrap=document.createElement('label');wrap.textContent=title+(row[field]?' (leave empty to keep current file)':'');const input=document.createElement('input');input.type='file';input.name=field;input.accept=kind==='videos'&&field==='filename'?'video/mp4,video/webm':'image/jpeg,image/png,image/webp';wrap.append(input);f.append(wrap)}const save=document.createElement('button');save.textContent='Save';f.append(save);f.onsubmit=async e=>{e.preventDefault();try{const data=new FormData(f);if(kind==='settings')await api('/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(data))});else await api(`/content/${kind}${row.id?'/'+row.id:''}`,{method:'POST',body:data});say('Saved.');await load()}catch(err){say(err.message,true)}};$('editor').scrollIntoView({behavior:'smooth',block:'start'})}
  Object.entries(configs).forEach(([key,entry])=>{const button=document.createElement('button');button.type='button';button.dataset.kind=key;button.textContent=entry.label;button.onclick=()=>{kind=key;say('');load()};$('navigation').append(button)});$('add').onclick=()=>edit();refreshSession().catch(err=>say(err.message,true));
})();
</script></body></html>
